<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="pustka">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="1280" height="6" patternUnits="userSpaceOnUse">
      <rect width="1280" height="2" fill="#000" fill-opacity="0.45"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="#080404"/>
  <g transform="translate(415 95) scale(1.25)" filter="url(#glow)">
    <circle cx="180" cy="180" r="118" fill="none" stroke="#F4E9E4" stroke-width="40" stroke-linecap="round" stroke-dasharray="180 561.4" transform="rotate(-150 180 180)"/>
    <circle cx="180" cy="180" r="118" fill="none" stroke="#FF2A2A" stroke-width="40" stroke-linecap="round" stroke-dasharray="180 561.4" transform="rotate(-30 180 180)"/>
    <circle cx="180" cy="180" r="118" fill="none" stroke="#A8161A" stroke-width="40" stroke-linecap="round" stroke-dasharray="180 561.4" transform="rotate(90 180 180)"/>
    <line x1="92" y1="268" x2="268" y2="92" stroke="#FFB000" stroke-width="40" stroke-linecap="round"/>
  </g>
  <rect width="1280" height="640" fill="url(#scan)"/>
</svg>
